# GetCertus: build the Railway image once and publish it to GitHub Container Registry, so new
# customer instances start from a ready image in seconds instead of a ~8 minute build.
name: GetCertus image

on:
  push:
    branches:
      - getcertus/brand
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: getcertus-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: railway.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/getcertus-auth:latest
            ghcr.io/${{ github.repository_owner }}/getcertus-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
